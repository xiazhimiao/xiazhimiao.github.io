<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小车驾驶技能学习 · 夏之渺</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1013;
      color: #eef2f4;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }
    .bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .topbar {
      position: fixed; top: 0; left: 0; z-index: 20;
      padding: 14px clamp(20px, 4vw, 40px);
    }
    .topbar img {
      display: block; width: 40px; height: 40px;
      border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .page { padding: 104px clamp(20px, 8vw, 120px) 80px; }

    h1 {
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 600; letter-spacing: 0.1em;
      text-align: center;
    }

    .sec { margin-top: 80px; }
    .sec h2 { font-size: 15px; font-weight: 600; }
    .rule { height: 1px; background: rgba(255, 255, 255, 0.1); margin-top: 14px; }
    .empty { margin-top: 18px; font-size: 13px; color: rgba(238, 242, 244, 0.4); }

    /* 横向时间线 */
    .tl-wrap {
      margin-top: 32px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .tl {
      position: relative;
      display: flex;
      min-width: max-content;
      list-style: none;
    }
    .tl::before {
      content: "";
      position: absolute;
      left: 74px; right: 74px; top: 35px;
      height: 1px;
      background: rgba(255, 255, 255, 0.16);
    }
    .tl-item {
      position: relative;
      width: 148px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .tl-date {
      font-size: 12px; line-height: 18px;
      color: rgba(238, 242, 244, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .tl-dot {
      margin-top: 12px;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: #0b1013;
    }
    .tl-item.is-done .tl-dot { background: rgba(238, 242, 244, 0.75); border-color: rgba(238, 242, 244, 0.75); }
    .tl-item.is-now .tl-dot {
      background: #eef2f4; border-color: #eef2f4;
      outline: 1px solid rgba(238, 242, 244, 0.35);
      outline-offset: 3px;
    }
    .tl-label { margin-top: 13px; font-size: 14px; color: rgba(238, 242, 244, 0.85); }
    .tl-state { margin-top: 3px; font-size: 12px; color: rgba(238, 242, 244, 0.4); }
    /* 视频进度条 */
    .vbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      height: 2px;
      background: rgba(255, 255, 255, 0.14);
    }
    .vbar span {
      display: block;
      height: 100%;
      width: 0;
      background: #4fd1c5;
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline poster="img/poster.jpg">
    <source src="video/bg.mp4" type="video/mp4">
  </video>

  <a class="topbar" href="toc.html" aria-label="返回目录">
    <img src="img/avatar.jpg" alt="夏之渺">
  </a>

  <main class="page">
    <h1>小车驾驶技能学习</h1>

    <section class="sec">
      <h2>时间线</h2>
      <div class="rule"></div>
      <div class="tl-wrap">
        <ol class="tl">
          <li class="tl-item is-done">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">报名</span>
            <span class="tl-state">已完成</span>
          </li>
          <li class="tl-item is-done">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">科目一</span>
            <span class="tl-state">已完成</span>
          </li>
          <li class="tl-item is-now">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">科目二</span>
            <span class="tl-state">进行中</span>
          </li>
          <li class="tl-item">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">科目三</span>
            <span class="tl-state">未开始</span>
          </li>
          <li class="tl-item">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">科目四</span>
            <span class="tl-state">未开始</span>
          </li>
          <li class="tl-item">
            <span class="tl-date">—</span>
            <span class="tl-dot"></span>
            <span class="tl-label">拿证</span>
            <span class="tl-state">未开始</span>
          </li>
        </ol>
      </div>
    </section>

    <section class="sec">
      <h2>学习资料</h2>
      <div class="rule"></div>
      <p class="empty">暂无资料</p>
    </section>

    <section class="sec">
      <h2>阶段学习</h2>
      <div class="rule"></div>
      <p class="empty">暂无阶段</p>
    </section>
  </main>
  <div class="vbar"><span id="vbar"></span></div>

  <script>
    (function () {
      "use strict";
      var v = document.querySelector("video");
      var bar = document.getElementById("vbar");
      if (!v || !bar) return;
      var last = 0;
      function newColor() {
        var h = Math.floor(Math.random() * 360);
        var s = 70 + Math.floor(Math.random() * 26);
        var l = 55 + Math.floor(Math.random() * 16);
        bar.style.background = "hsl(" + h + ", " + s + "%, " + l + "%)";
      }
      newColor();
      (function tick() {
        var t = v.currentTime;
        if (v.duration) bar.style.width = (t / v.duration * 100) + "%";
        if (t + 0.05 < last) newColor();
        last = t;
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
</html>
