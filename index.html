<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏之渺</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background: #0c1216;
      color: #eef2f4;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .card {
      position: relative;
      height: 100%;
      max-width: 720px;
      padding: 0 8vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .name {
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }
    .name a {
      color: inherit;
      text-decoration: none;
    }
    .name a:hover {
      text-decoration: underline;
      text-underline-offset: 8px;
      text-decoration-thickness: 1px;
      text-decoration-color: rgba(255, 255, 255, 0.5);
    }

    .sign {
      max-width: 22em;
      font-size: 16px;
      line-height: 2;
      letter-spacing: 0.06em;
      color: rgba(238, 242, 244, 0.82);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    @media (max-width: 640px) {
      .name { font-size: 32px; }
      .avatar { width: 76px; height: 76px; }
    }
    /* 视频进度条 */
    .vbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      height: 2px;
      background: rgba(255, 255, 255, 0.14);
    }
    .vbar span {
      display: block;
      height: 100%;
      width: 0;
      background: #4fd1c5;
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline poster="img/poster.jpg">
    <source src="video/bg.mp4" type="video/mp4">
  </video>

  <main class="card">
    <img class="avatar" src="img/avatar.jpg" alt="夏之渺">
    <h1 class="name">夏之<a href="toc.html">渺</a></h1>
    <p class="sign">好像独坐空木房檐下，雷吹风铃柳叶悠悠，心如止水无烦恼事</p>
  </main>
  <div class="vbar"><span id="vbar"></span></div>

  <script>
    (function () {
      "use strict";
      var v = document.querySelector("video");
      var bar = document.getElementById("vbar");
      if (!v || !bar) return;
      var last = 0;
      function newColor() {
        var h = Math.floor(Math.random() * 360);
        var s = 70 + Math.floor(Math.random() * 26);
        var l = 55 + Math.floor(Math.random() * 16);
        bar.style.background = "hsl(" + h + ", " + s + "%, " + l + "%)";
      }
      newColor();
      (function tick() {
        var t = v.currentTime;
        if (v.duration) bar.style.width = (t / v.duration * 100) + "%";
        if (t + 0.05 < last) newColor();
        last = t;
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
</html>
