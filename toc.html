<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录 · 夏之渺</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c1216;
      color: #eef2f4;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景：与首页同一张壁纸 */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: rgba(6, 10, 14, 0.52);
      background-image: linear-gradient(180deg, rgba(6, 10, 14, 0.35) 0%, rgba(6, 10, 14, 0.15) 40%, rgba(6, 10, 14, 0.45) 100%);
    }

    /* 全站常驻顶栏：小头像 */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 14px clamp(20px, 4vw, 40px);
    }
    .topbar img {
      display: block;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.28);
      transition: border-color 0.3s ease;
    }
    .topbar:hover img { border-color: rgba(255, 255, 255, 0.55); }

    /* 目录：自适应网格，四边留白（与首页同一套左右留白） */
    .toc {
      padding: 96px clamp(20px, 8vw, 120px) clamp(24px, 5vw, 64px);
    }
    .toc h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.34em;
      color: rgba(238, 242, 244, 0.6);
      margin-bottom: 26px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: clamp(16px, 2vw, 26px);
    }
    /* 卡片：悬停 3D 翻面，背面为白底 */
    .entry {
      display: block;
      height: 152px;
      perspective: 1000px;
      color: inherit;
      text-decoration: none;
    }
    .entry-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .entry:hover .entry-inner,
    .entry:focus-visible .entry-inner {
      transform: rotateY(-180deg);
    }
    .entry-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .entry-front {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(10, 16, 20, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s ease;
    }
    .entry:hover .entry-front { border-color: rgba(255, 255, 255, 0.42); }
    .entry-back {
      transform: rotateY(180deg);
      background: #ffffff;
      color: #0c1216;
      justify-content: center;
    }
    .entry-enter {
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: 18px;
      letter-spacing: 0.1em;
    }
    .entry-date {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(12, 18, 22, 0.55);
    }
    .entry-title {
      font-family: "Songti SC", "STSong", "SimSun", Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.08em;
    }
    .entry-sub {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: rgba(238, 242, 244, 0.6);
    }
    .entry-meta {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(238, 242, 244, 0.45);
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline poster="img/poster.jpg">
    <source src="video/bg.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>

  <a class="topbar" href="index.html" aria-label="返回首页">
    <img src="img/avatar.jpg" alt="夏之渺">
  </a>

  <main class="toc">
    <h2>目录</h2>
    <div class="grid">
      <a class="entry" href="bank.html">
        <span class="entry-inner">
          <span class="entry-face entry-front">
            <span class="entry-title">银行技术岗</span>
            <span class="entry-sub">选岗 · 报名 · 学习记录</span>
            <span class="entry-meta">尚未开始</span>
          </span>
          <span class="entry-face entry-back">
            <span class="entry-enter">进入主题</span>
            <span class="entry-date">创建于 2026-09-15</span>
          </span>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
